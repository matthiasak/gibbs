[package]
name = "gibbs-engine"
version = "0.1.0"
edition = "2021"
authors = ["Gibbs Systems <engineering@gibbs.ai>"]
description = "Gibbs: Autonomous Universal Inference Engine & JIT Megakernel Runtime"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gibbs"
path = "src/main.rs"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"
async-trait = "0.1"

# Memory & Lock-Free Data Structures
parking_lot = "0.12"
crossbeam = "0.8"
bytes = "1.7"
byteorder = "1.5"
memmap2 = "0.9"
pytorch-reader = "0.22.0-pre.4"
rten-onnx = "0.26"

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
clap = { version = "4.5", features = ["derive"] }
# Tokenization & chat templates (exact HF tokenizer.json semantics; model-declared Jinja templates)
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
minijinja = { version = "2", features = ["loop_controls", "json", "preserve_order"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Terminal UI & Observability
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.12"
libc = "0.2"
# Equality saturation for graph fusion (src/graph/egraph.rs, GIBBS_EGRAPH=1)
egglog = "3.0.0"

# Apple GPU: MTLDevice, runtime MSL compilation, shared buffers (--backend metal)
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
# Apple Neural Engine: private AppleNeuralEngine.framework classes through the ObjC runtime
objc = "0.2"

