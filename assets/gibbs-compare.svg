<title id="gibbs-compare-title">Gibbs vs llama.cpp on Apple Silicon</title>
<desc id="gibbs-compare-desc">Two bar charts. A: decode speed on Apple M5 Pro with the same GGUF files, as percent of the Gibbs roofline: Gemma 4 E2B QAT · UD-Q2_K_XL Gibbs 130.1 tok/s (38.1%), llama.cpp 121.1 tok/s (35.4%); Gemma 4 E2B · Q4_K_M Gibbs 98.3 tok/s (50.6%), llama.cpp 92.6 tok/s (47.7%); Qwen3.5 2B · UD-Q4_K_XL Gibbs 130.7 tok/s (59.3%), llama.cpp 120.6 tok/s (54.7%); Qwen3.5 9B (DavidAU MTP) · IQ2_M Gibbs 41.1 tok/s (64.5%), llama.cpp 35.4 tok/s (55.5%); Llama 3.2 1B · Q4_0 Gibbs 238.0 tok/s (63.6%), llama.cpp 215.8 tok/s (57.6%); Gemma 4 26B-A4B · UD-IQ2_XXS Gibbs 77.7 tok/s (59.2%), llama.cpp 65.0 tok/s (49.4%); Gemma 4 E2B QAT · 4k context Gibbs 120.2 tok/s (35.2%), llama.cpp 99.2 tok/s (29.0%). B: bytes per token times tok/s as percent of Apple's 307 GB/s spec for Apple M5 Pro, 16-core GPU: llama.cpp llama.cpp · Llama 2 7B · F16 · 13.48 GB 93.9%; Gibbs · Llama 2 7B · F16 · 13.21 GB 86.3%; llama.cpp · Llama 2 7B · Q8_0 · 7.16 GB 90.8%; Gibbs · Llama 2 7B · Q8_0 · 7.02 GB 81.4%; llama.cpp · Llama 2 7B · Q4_0 · 3.79 GB 83.4%; Gibbs · Llama 2 7B · Q4_0 · 3.72 GB 75.5%; Qwen3.5 9B (DavidAU MTP) · IQ2_M · 4.49 GB 60.2%; Gemma 4 26B-A4B · UD-IQ2_XXS · 2.18 GB 55.2%; Gemma 4 E2B · Q4_K_M · 1.47 GB 47.2%; Qwen3.5 2B · UD-Q4_K_XL · 1.30 GB 55.3%; Gemma 4 E2B QAT · UD-Q2_K_XL · 0.84 GB 35.5%; Gemma 4 E2B QAT · 4k context · 0.84 GB 32.8%; Llama 3.2 1B · Q4_0 · 0.76 GB 59.3%; Llama 3.2 1B · bnb 4-bit · 0.67 GB 54.1%; SmolLM2 135M · safetensors · 0.13 GB 25.0%.</desc>
